    <linearGradient id="aRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
