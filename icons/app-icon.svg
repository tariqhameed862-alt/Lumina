  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#tileGlow)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="27.3" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
